[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weaverstack"
dynamic = ["version"]
description = "Central-catalogue data engineering runtime for Microsoft Fabric Lakehouses and Warehouses."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Matthias Wong" }]
keywords = ["fabric", "onelake", "lakehouse", "delta", "warehouse", "etl"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]

# What installed Weaver needs to run. Environment publication reads this list,
# excludes the desktop transports, and resolves the Fabric wheel closure.
# PySpark is absent because Fabric supplies it where authored runtime code runs.
dependencies = [
    "pyyaml",
    "sqlparse",
    "mssql-python",
    "azure-identity>=1.23",
    "requests>=2.31",
    "build>=1.2",
    "prompt_toolkit>=3.0",
    "packaging>=24",
]

[project.optional-dependencies]
# The test suite. Needs no JVM and no Spark:
#   pytest                      core suite
#   pytest -m fabric            plus a workspace, a capacity and `az login`
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[project.scripts]
weaver = "weaver_cli:main"

[project.urls]
Homepage = "https://github.com/matthias-wong-dev/weaverstack"

# Version comes from Git, not a hand-edited string, so every changed checkout
# builds an identifiable wheel. The scheme (see hatch_build.py) is a public,
# content-addressed dev version — stable for identical source and free of the
# PEP 440 '+' local segment that Fabric's Environment upload rejects.
#   clean at tag v0.1.0        -> 0.1.0
#   ahead of / dirtier than it -> 0.1.1.dev<fingerprint>
[tool.hatch.version]
source = "code"
path = "hatch_build.py"
expression = "compute_version()"

[tool.hatch.build.targets.wheel]
packages = ["src/weaver", "src/weaver_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Execution-cost selector. This is independent of the generated declaration
    # markers and requires --runslow.
    "slow: an opt-in test whose live operation is too expensive for the ordinary selection",
    # Place. Every test that needs a real workspace carries it, so `-m fabric`
    # is the whole set rather than a subset that quietly excludes the expensive
    # half — which is what `fabric` meaning *both* place and precondition cost.
    "fabric: needs a real Fabric workspace. Carried by every Fabric test, whatever it needs beyond one",
    # Generated selection mechanics. @weaver_test is the declaration source.
    "remote: Weaver runs on this machine and reaches into Fabric — the desktop CLI's position. Needs no publish, so this is the fast loop (pytest -m 'fabric and remote')",
    "hosted: Weaver runs inside a Fabric session, as the installed wheel — the product's own position. Needs `weaver install` first (pytest -m 'fabric and hosted')",
    # Integration is a complete scope, not an extra position flag.
    "full_integration: a comprehensive Fabric lifecycle journey, which proves the whole pipeline composes rather than answering any single question. Opted into by name, so the expensive composition proof runs by exception",
    # Resource selectors generated from @weaver_test(resources=...).
    "tds: test claim requires a TDS boundary crossing",
    "livy: test claim requires a Livy boundary crossing",
    "onelake: test claim requires a OneLake boundary crossing",
    "rest: test claim requires a Fabric REST boundary crossing",
]
# Default runs stay fast and need no JVM.
addopts = [
    "-m",
    "not fabric and not full_integration",
]


# Mechanical hygiene only: unused and duplicate imports, undefined names, dead
# formatting. Nothing about types or style opinions — what this catches is
# debris, which review should not have to.
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Fabric notebook content: `spark` and `display` are injected by the host, and
# its cells are imports interleaved with code by definition.
"examples/workspaces/**/notebook-content.py" = ["F821", "E402"]
# Authored fixtures are Weaver documents, not modules of this package.
"tests/fixtures/**" = ["F821", "F841", "E402"]
# Public namespaces re-export deliberately.
"src/weaver/__init__.py" = ["F401"]
"src/weaver/fabric/__init__.py" = ["F401"]
"src/weaver/build_bundle/__init__.py" = ["F401"]
"src/weaver/sessions/__init__.py" = ["F401"]
