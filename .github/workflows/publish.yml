# Pushing a `v*` tag is the release event. See design/releasing.md.
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: verify and build
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The version source needs the history and the triggering tag.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify the tag matches VERSION
        id: version
        run: |
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION file  $version"
          echo "Git tag       $GITHUB_REF_NAME"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          fi

      - run: pip install -r requirements-dev.txt
      - run: pip install -e . --no-deps

      - run: ruff check src tests examples tools hatch_build.py
      - run: ruff format --check src tests examples tools hatch_build.py

      # Fabric tests need live infrastructure, so they stay out of this path.
      - run: pytest

      - name: Build distributions
        run: |
          pip install build twine
          python -m build

      - name: Verify the built artefacts carry the expected version
        run: python tools/check_release_artefacts.py --version "${{ steps.version.outputs.version }}"

      - run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: create the GitHub Release
    # Only after PyPI, so a Release never claims a publication that failed.
    needs: [build, publish]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "weaverstack $VERSION" \
            --generate-notes \
            dist/*
