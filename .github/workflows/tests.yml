# CI checks the supported Python environment.
#
# Fabric and local Spark tests are run explicitly when relevant rather than on
# every pull request.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core / macOS / py3.11
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements-dev.txt
      - run: pip install -e . --no-deps
      # No -m: the marker expression lives in pyproject's addopts, and repeating
      # it here let the two drift — CI's copy omitted `not provisioning`, so it
      # selected tests that need a Fabric workspace and only stayed green because
      # a fixture happened to skip them.
      - run: pytest