# CI checks the primary Python desktop environment.
#
# Fabric tests are run explicitly when relevant rather than on every pull
# request: they need a workspace, a running capacity and a credential.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core / Windows / py3.13
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements-dev.txt
      - run: pip install -e . --no-deps

      # The install above is --no-deps, so nothing has yet checked that the
      # pinned versions satisfy what the package metadata requires.
      - run: python -m pip check

      # Mechanical hygiene first: it is seconds, and a lint failure should not
      # wait behind three minutes of tests to be reported.
      - run: ruff check src tests examples tools hatch_build.py
      - run: ruff format --check src tests examples tools hatch_build.py

      # No -m: the marker expression lives in pyproject's addopts, and repeating
      # it here let the two drift — CI's copy omitted `not provision`, so it
      # selected tests that need a Fabric workspace and only stayed green because
      # a fixture happened to skip them.
      - run: pytest
