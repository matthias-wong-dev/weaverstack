<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 95 800 385" role="img" aria-label="Weaver logo" preserveAspectRatio="xMidYMid meet">

 <defs>
  <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="22%">
   <stop offset="0" stop-color="#255fdb"/>
   <stop offset=".22" stop-color="#204b97"/>
   <stop offset=".48" stop-color="#16386c"/>
   <stop offset=".70" stop-color="#173875"/>
   <stop offset="1" stop-color="#2769df"/>
  </linearGradient>
  <linearGradient id="left-wing" x1="5%" y1="8%" x2="80%" y2="95%">
   <stop offset="0" stop-color="#60b4ff"/>
   <stop offset=".26" stop-color="#3084f5"/>
   <stop offset=".70" stop-color="#1d44d4"/>
   <stop offset="1" stop-color="#2252a4"/>
  </linearGradient>
  <linearGradient id="right-wing" x1="20%" y1="95%" x2="80%" y2="0%">
   <stop offset="0" stop-color="#20498f"/>
   <stop offset=".35" stop-color="#1d44d4"/>
   <stop offset=".77" stop-color="#388bf5"/>
   <stop offset="1" stop-color="#69b9ff"/>
  </linearGradient>
  <linearGradient id="inset" x1="5%" y1="0%" x2="90%" y2="80%">
   <stop offset="0" stop-color="#143a78"/>
   <stop offset=".3" stop-color="#19438d"/>
   <stop offset=".47" stop-color="#174cbe"/>
   <stop offset=".64" stop-color="#0c2758"/>
   <stop offset="1" stop-color="#143a78"/>
  </linearGradient>
  <linearGradient id="front-fold" x1="0%" y1="0%" x2="95%" y2="95%">
   <stop offset="0" stop-color="#285fdf"/>
   <stop offset=".37" stop-color="#316ff1"/>
   <stop offset=".67" stop-color="#2358d6"/>
   <stop offset="1" stop-color="#102d80"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" x2="0" y1="0" y2="1">
   <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
   <stop offset=".5" stop-color="#ffffff" stop-opacity=".04"/>
   <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="top-flat">
    <rect x="48" y="104" width="710" height="360"/>
  </clipPath>
  <clipPath id="w-shape">
   <path d="M 104 80 C 145 178 186 293 226 363 C 239 393 256 393 274 363 C 319 287 347 214 376 167 C 385 150 395 152 405 168 C 435 218 478 304 517 364 C 535 392 553 390 567 362 C 613 280 652 167 694 80" fill="none" stroke="white" stroke-width="114" stroke-linecap="butt" stroke-linejoin="round"/>
  </clipPath>
 </defs>
 <!-- Crisp, flat upper terminals and smooth full W silhouette. -->
 <g clip-path="url(#top-flat)">
   <path d="M 104 80 C 145 178 186 293 226 363 C 239 393 256 393 274 363 C 319 287 347 214 376 167 C 385 150 395 152 405 168 C 435 218 478 304 517 364 C 535 392 553 390 567 362 C 613 280 652 167 694 80" stroke="url(#base)" stroke-width="114" stroke-linecap="butt" stroke-linejoin="round" fill="none"/>
   <g clip-path="url(#w-shape)">
     <!-- dark recessed inner rises and descending fold -->
     <path d="M244 383 C294 298 354 173 388 160 C421 183 486 303 540 389" fill="none" stroke="url(#inset)" stroke-width="113" stroke-linecap="round" stroke-linejoin="round"/>
     <!-- the blue woven ribbon in front of the recessed left fold -->
     <path d="M244 371 C287 302 352 180 379 169 C393 159 400 172 411 188 C447 245 485 319 528 375" fill="none" stroke="url(#front-fold)" stroke-width="99" stroke-linecap="butt" stroke-linejoin="round"/>
     <!-- bright wings sit over the woven ribbon at the two bottom turns -->
     <path d="M103 78 C143 178 186 293 229 364" fill="none" stroke="url(#left-wing)" stroke-width="112" stroke-linecap="round"/>
     <path d="M567 364 C612 275 655 169 694 78" fill="none" stroke="url(#right-wing)" stroke-width="112" stroke-linecap="round"/>
   </g>
 </g>

</svg>