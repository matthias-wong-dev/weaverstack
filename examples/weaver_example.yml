# One file describes one Workspace. Fabric is the only workspace there is.
workspace: Weaver Example
environment: weaver
catalogue: Warehouse/Weaver

# How many Build, Wipe and Mirror actions may run at once on each Fabric
# capability. These are the defaults, sized for a mid-sized capacity; an F64
# sustains twice as much, and a small capacity may need less.
execution:
  build:
    warehouse_concurrency: 2   # per Warehouse
    spark_concurrency: 4
    onelake_concurrency: 8
    shortcut_concurrency: 2

# Weaver items are the keys; each value is the Fabric item it is deployed to in
# this environment. The key's type says whether that value names a Lakehouse or
# a Warehouse.
targets:
  Lakehouse/Sales: Sales

  Warehouse/Reporting: Reporting
