# One file describes one Workspace. Fabric is the only workspace there is.
workspace: Weaver Example
environment: weaver
catalogue: Warehouse/Weaver

execution:
  parallel_workers: 4

# Logical Weaver items are keys; the value is the physical Fabric item each one
# is deployed to in this environment. The key's item type says whether that
# value names a Lakehouse or a Warehouse, so one mapping serves both.
targets:
  Lakehouse/Sales: Sales

  Warehouse/Reporting:
    name: Reporting
    execution:
      parallel_workers: 2
