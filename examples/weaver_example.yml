# One file describes one Workspace. Fabric is the only workspace there is.
workspace: Weaver Example
environment: weaver
catalogue: Warehouse/Weaver

# The most physical actions a build runs at once, overall and against any one
# Fabric capability. Lower it for a smaller capacity; unset, Weaver uses limits
# qualified on an F64.
execution:
  parallel_workers: 4

# Weaver items are the keys; each value is the Fabric item it is deployed to in
# this environment. The key's type says whether that value names a Lakehouse or
# a Warehouse.
targets:
  Lakehouse/Sales: Sales

  # An item's own setting caps the actions run at once against its Fabric item.
  Warehouse/Reporting:
    name: Reporting
    execution:
      parallel_workers: 2
