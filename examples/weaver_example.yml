# One file describes one Workspace. workspace_type defaults to fabric.
workspace: Weaver Example
environment: weaver
weaver_lakehouse: Weaver

execution:
  parallel_workers: 4

# Physical target names are keys; logical items are their configured defaults.
lakehouses:
  Sales_Dev: Lakehouse/Sales

warehouses:
  Reporting_Dev:
    item: Warehouse/Reporting
    execution:
      parallel_workers: 2
