# One file describes one Workspace. Fabric is the only workspace there is.
workspace: Weaver Example
environment: weaver
catalogue: Warehouse/Weaver

execution:
  parallel_workers: 4

# Physical target names are keys; logical items are their configured defaults.
lakehouses:
  Sales: Lakehouse/Sales

warehouses:
  Reporting:
    item: Warehouse/Reporting
    execution:
      parallel_workers: 2
