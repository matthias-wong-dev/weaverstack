# The Weaver Example development loop, written down once.
#
#   weaver compose dev --file examples/compose.yml
#
# Paths are as you would type them, so run this from the repository root.
# Nothing here is discovered: the composition names its file, and the commands
# name their repository and workspace.

compose:
  # Everything from empty: clear the estate, build it, load it, test it.
  dev:
    - weaver wipe Lakehouse/Sales Warehouse/Reporting --workspace-config "examples/weaver_example.yml"
    - weaver build "examples/workspaces/Weaver Example/Sales-Estate.Notebook/Resources/builtin/repository" --bind Lakehouse/Sales=Lakehouse/Sales --bind Warehouse/Reporting=Warehouse/Reporting --workspace-config "examples/weaver_example.yml"
    - weaver load Lakehouse/Sales Warehouse/Reporting --workspace-config "examples/weaver_example.yml"
    - weaver test Lakehouse/Sales Warehouse/Reporting --workspace-config "examples/weaver_example.yml"

  # The inner loop: an authored change, rebuilt and re-run without wiping.
  rebuild:
    - weaver build "examples/workspaces/Weaver Example/Sales-Estate.Notebook/Resources/builtin/repository" --bind Lakehouse/Sales=Lakehouse/Sales --bind Warehouse/Reporting=Warehouse/Reporting --workspace-config "examples/weaver_example.yml"
    - weaver load Lakehouse/Sales Warehouse/Reporting --workspace-config "examples/weaver_example.yml"
    - weaver test Lakehouse/Sales Warehouse/Reporting --workspace-config "examples/weaver_example.yml"
